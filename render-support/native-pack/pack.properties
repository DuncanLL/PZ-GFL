name=Native GFL 2
author=CRASHCRASHCRASH
description=Original Native scene and post settings with common GF2 character materials and lighting inputs.
base=default
options=characterSoftFill characterShadowContrast characterDisplayStrength characterSurfaceDetail characterSkinGloss characterOutlineWidth characterReflectionProbe
option.characterReflectionProbe.label=人物环境实时反射
option.characterReflectionProbe.tooltip=让金属、皮革、丝绸等材质实时倒映周围场景，质感更立体；关闭可节省约 5-10 帧。
option.characterReflectionProbe.default=false
option.characterReflectionProbe.kept=true
option.characterOutlineWidth.label=人物描边粗细
option.characterOutlineWidth.tooltip=缩放人物原材质的描边宽度。0 关闭描边，1 保持原效果（远景会自动随画面占比变细）。
option.characterOutlineWidth.range=0 2 0.01
option.characterOutlineWidth.default=1
option.characterOutlineWidth.kept=true
option.characterSurfaceDetail.label=皮肤肌理凹凸
option.characterSurfaceDetail.tooltip=加强皮肤原法线的起伏与微颗粒质感（如锁骨、腰腹与皮肤细纹）。0 为原游默认。
option.characterSurfaceDetail.range=0 2 0.01
option.characterSurfaceDetail.default=0
option.characterSurfaceDetail.kept=true
option.characterSkinGloss.label=皮肤水润光泽
option.characterSkinGloss.tooltip=降低皮肤粗糙度，让皮肤反光更集中水润。0 为原游默认。
option.characterSkinGloss.range=0 2 0.01
option.characterSkinGloss.default=0
option.characterSkinGloss.kept=true
option.characterShadowContrast.label=人物明暗反差
option.characterShadowContrast.tooltip=调节人物受光面与暗部阴影的对比度。1 为默认；调低更柔和明快（偏二次元），调高阴影更深邃立体。
option.characterShadowContrast.range=0 2 0.01
option.characterShadowContrast.default=1
option.characterShadowContrast.kept=true
option.characterSoftFill.label=人物面部补光
option.characterSoftFill.tooltip=从镜头方向给人物补充柔和正面光，避免背光脸黑；随环境亮度自适应，0 为关闭，不影响场景灯光。
option.characterSoftFill.range=0 2 0.01
option.characterSoftFill.default=0.08
option.characterSoftFill.kept=true
option.characterDisplayStrength.label=人物原游色调还原
option.characterDisplayStrength.tooltip=0 跟随僵毁电影色调，1 完全还原少前2原游通透肤色与发色；只影响人物，不改变场景曝光与后处理。
option.characterDisplayStrength.range=0 1 0.01
option.characterDisplayStrength.default=0.5
option.characterDisplayStrength.kept=true
